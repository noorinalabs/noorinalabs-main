# lychee link-checker config for noorinalabs-main docs (#326).
#
# Purpose: catch BROKEN INTERNAL cross-references between docs (e.g. the
# charter docs link to each other and to artifact-ownership.md; a renamed or
# missing target is a real defect). External-URL liveness is intentionally NOT
# gated here — it depends on third-party uptime and would make CI flaky and
# non-deterministic (a 503 on some unrelated site should never block a docs
# PR). External links are excluded; internal/relative links are checked.

# Only check local filesystem + relative links; skip all remote schemes.
scheme = ["file"]

# Treat these as offline-only — never make network requests.
offline = true

# Exclude link targets that are not real broken-link signals.
exclude = [
  # mailto / anchors handled separately; bare example hosts in prose.
  '^https?://',
  '^mailto:',
  # GitHub issue/PR shorthand like `#326` is not a URL.
  '^#\d+$',
]

# Don't fail on links inside fenced code blocks (illustrative, not real refs).
exclude_path = [
  "noorinalabs-isnad-graph",
  "noorinalabs-user-service",
  "noorinalabs-deploy",
  "noorinalabs-design-system",
  "noorinalabs-data-acquisition",
  "noorinalabs-isnad-ingest-platform",
  "noorinalabs-landing-page",
  ".claude/worktrees",
  # In-repo project-memory corpus (#732 enabler) — uses [[wikilink]] shorthand
  # and bare refs, not lychee-checkable relative links; excluded like the other
  # append-only records.
  ".claude/memory",
  # Frozen per-phase archives of feedback_log.md / trust_matrix.md (#964) —
  # byte-for-byte relocations of append-only records; relative links inside
  # them resolved from the ORIGINAL location and are not defects here.
  ".claude/team/archive",
  "node_modules",
]

# A relative link with no matching file is the failure we DO want to surface.
require_https = false
