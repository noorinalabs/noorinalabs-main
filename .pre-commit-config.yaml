# Pre-commit hooks for noorinalabs-main
# Install:  pre-commit install && pre-commit install --hook-type pre-push
# Docs:     https://pre-commit.com/
#
# This MIRRORS .github/workflows/ci.yml so local commits/pushes fail fast
# instead of surfacing a lint/type/test error only after a PR is opened
# (Phase-3 end-state criterion #6 / #327). Keep `rev` aligned with sibling
# repos (isnad-graph pins ruff 0.15.11) so the same ruff version runs in
# local pre-commit and in CI.
#
# Stage split:
#   pre-commit (fast, every commit) — ruff-format, ruff-lint, actionlint, cspell.
#   pre-push   (heavier, every push) — mypy typecheck, pytest suite. These run
#     the whole hooks+lib surface, so they're push-time not commit-time to keep
#     the commit loop snappy while still catching everything before it leaves
#     the machine.
#
# Optional hook dependency — bashlex (#748 D3b): the commit-identity hooks
# import bashlex for a structural Bash-AST parse, falling back to a shlex/regex
# path when it is absent (runtime zero-setup-on-pull is preserved). The
# mypy/pytest hooks below are `language: system`, so `additional_dependencies`
# does NOT apply to them — install bashlex into the same system Python that runs
# mypy/pytest (`pip install bashlex`) so local pre-push exercises the SAME
# enforced AST path CI does. Without it, the bashlex-specific tests skip and
# pre-push validates only the fallback path (still green, but not the enforced
# path). bashlex is NOT a new sync-gate check kind — it is a library dependency
# of an existing hook, so .pre-commit-config ⇄ CI kind parity is unaffected.
#
# Scope: `.claude/hooks/` + `.claude/lib/` + `.claude/skills/` — the Python that
# CI checks (CI runs ruff/mypy/pytest on all three; the pre_commit_ci_sync gate
# enforces this mirror). `.claude/skills/` was added per #326 (criterion #5 —
# skill helper/test .py was previously un-gated). The `.claude/worktrees/` tree
# is excluded because it holds scratch checkouts of other branches; reformatting
# them would silently overwrite in-progress work.
#
# The kind-level mirror (ruff-lint, ruff-format, mypy, pytest present on both
# sides) is enforced in CI by `.claude/lib/pre_commit_ci_sync.py` — if a future
# edit drops one side, that gate fails the build.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff-format
        name: ruff-format
        files: ^\.claude/(hooks|lib|skills)/.*\.py$
        exclude: ^\.claude/worktrees/
      - id: ruff
        name: ruff-lint
        args: [--fix]
        files: ^\.claude/(hooks|lib|skills)/.*\.py$
        exclude: ^\.claude/worktrees/

  # actionlint mirrors the `Config — Workflow actionlint` CI job in
  # .github/workflows/docs.yml (the sync-drift gate globs ALL workflow files,
  # so a CI-enforced `actionlint` kind not mirrored here turns the gate red —
  # #571). The upstream golang hook builds a pinned actionlint and already
  # scopes to ^.github/workflows/. shellcheck MUST be on PATH so actionlint's
  # embedded shellcheck integration runs rather than silently skipping
  # (feedback_actionlint_needs_shellcheck) — CI gets this from ubuntu-latest's
  # preinstalled shellcheck; locally, install shellcheck before committing.
  # Pinned to v1.7.12 to match CI's docs.yml actionlint job, which downloads the
  # v1.7.12 release tarball and verifies its SHA256 before running (#579/#578) —
  # the same pinned version on both sides, no `main`-tracking installer.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: actionlint

  # cspell mirrors the `Spellcheck (cspell)` CI job in .github/workflows/docs.yml
  # (the sync-drift gate now classifies the `cspell` kind — #684 — so a
  # CI-enforced spell gate not mirrored here turns the gate red, same contract as
  # actionlint above). New domain vocabulary then fails `pre-commit run` locally
  # instead of only surfacing as a CI red after push (the P5W4 reds: ig#1080
  # "Aqidah", deploy#460 "Webauth"). Pinned to v8.4.0 of cspell-cli to match the
  # exact cspell the `streetsidesoftware/cspell-action@…v8.4.0` CI step bundles —
  # same engine + dictionaries on both sides. `language: node`, so pre-commit
  # provisions its own node/cspell env (no system cspell required).
  #
  # `files` is the regex equivalent of the CI action's authored-prose glob set
  # (charter, skills, ontology, root docs); `--config .cspell.json` reuses the
  # same dictionaries + ignore rules CI loads, so a word that passes locally
  # passes in CI and vice-versa.
  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v8.4.0
    hooks:
      - id: cspell
        name: cspell
        args: ["--no-must-find-files", "--no-progress", "--no-summary", "--config", ".cspell.json"]
        files: ^(\.claude/team/charter/.*\.md|\.claude/skills/.*\.md|ontology/.*\.md|CLAUDE\.md|CONTRIBUTING\.md|ONBOARDING\.md|README\.md|docs/.*\.md)$

  # Charter-prose→code gates (#735). Each runs a `.claude/lib/check_*.py` over
  # the matching file class, mirroring a CI job of the same name (the sync-drift
  # gate classifies both kinds — `dockerfile-base-pin`, `fixture-realism` — so
  # this mirror is mandatory, not optional). Both are commit-stage (cheap
  # static scans). `files:` scopes which paths are candidates; the check itself
  # self-filters (a non-Arabic file is skipped, a scratch/exempt FROM passes).
  # The parent repo ships no Dockerfiles or Arabic fixtures, so these match
  # nothing here today — they are the reusable template the #735 follow-up rolls
  # out to each child repo's real files.
  - repo: local
    hooks:
      - id: dockerfile-base-pin
        name: dockerfile-base-pin
        entry: python3 .claude/lib/check_dockerfile_base_pin.py
        language: system
        files: ((^|/)Dockerfile(\.[^/]+)?$|\.dockerfile$)
        exclude: ^\.claude/worktrees/
        pass_filenames: true
      - id: fixture-realism
        name: fixture-realism
        entry: python3 .claude/lib/check_fixture_realism.py
        language: system
        # Test-data / fixture conventions; the check skips any non-Arabic file.
        files: (^|/)(fixtures|test_data|testdata)/.*\.(json|jsonl|txt|csv|tsv|ndjson|py)$
        exclude: ^\.claude/worktrees/
        pass_filenames: true

  # Heavier checks run at pre-push (mirror CI's mypy + pytest jobs). Running as
  # `local`/`system` hooks so we use the system tools and don't drift from
  # whatever CI pins.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (pre-push)
        entry: python3 -m mypy --ignore-missing-imports --no-error-summary
        language: system
        types: [python]
        files: ^\.claude/(hooks|lib|skills)/.*\.py$
        # Skip worktree copies, and conftest.py — two test dirs each ship a
        # `conftest.py`, which collide under one flat mypy invocation ("Duplicate
        # module named conftest"). CI type-checks them safely via its per-dir
        # mypy loop (ci.yml); this file-list hook would pass both at once (#719).
        exclude: (^\.claude/worktrees/|(^|/)conftest\.py$)
        pass_filenames: true
        stages: [pre-push]
      - id: pytest
        name: pytest (pre-push)
        entry: env ENVIRONMENT=test python3 -m pytest .claude/hooks/tests/ .claude/lib/tests/ -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # Skill test suites are run per-skill (each from its own dir) because
      # several skills ship a top-level `tests` package that collides under one
      # flat pytest invocation. Mirrors ci.yml § "Run skill test suites". #326.
      - id: pytest-skills
        name: pytest-skills (pre-push)
        entry: bash -c 'status=0; for t in .claude/skills/*/tests; do [ -d "$t" ] || continue; d=$(dirname "$t"); ( cd "$d" && env ENVIRONMENT=test python3 -m pytest tests/ -q ) || status=1; done; exit $status'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # memory-budget mirrors the `Memory budget gate` CI job in ci.yml (the
      # sync-drift gate classifies the `memory-budget` kind — #733/#684 — so a
      # CI-enforced budget not mirrored here turns the gate red, same contract as
      # mypy/pytest above). HARD-BLOCKS a commit/push that grows the project
      # memory corpus past its size/count budget (a budget overflow can't be
      # auto-fixed — it needs a human consolidate/retire decision). `always_run`
      # because the budget is over the whole corpus, not the changed files; this
      # is a project-level check so it lives at pre-push alongside mypy/pytest.
      - id: memory-budget
        name: memory-budget (pre-push)
        entry: python3 .claude/lib/memory_budget.py .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # headcount-budget mirrors the `Headcount budget gate` CI job in ci.yml
      # (the sync-drift gate classifies the `headcount-budget` kind — #841/#684 —
      # so a CI-enforced budget not mirrored here turns the gate red, same
      # contract as memory-budget above). HARD-BLOCKS a commit/push that grows
      # the parent persona roster past its cap (parent <=9); an over-budget
      # roster can't be auto-fixed — it needs a human retire/merge decision.
      # Runs with the default (parent) budget; a child repo vendoring this gate
      # wires its own hook to pass `--budget 6`. `always_run` because the budget
      # is over the whole roster, not the changed files; pre-push alongside
      # memory-budget.
      - id: headcount-budget
        name: headcount-budget (pre-push)
        entry: python3 .claude/lib/headcount_budget.py .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # doc-freshness mirrors the `Doc-freshness gate (advisory)` CI job in
      # ci.yml (the sync-drift gate classifies the `doc-freshness` kind — #768/#684
      # — so the CI advisory check must be mirrored here or the gate goes red).
      # ADVISORY: doc_freshness.py always exits 0, so this hook never blocks a
      # push — it prints which code surfaces changed without a matching doc
      # update so the author sees the nudge before the PR opens. `always_run`
      # because it computes its own three-dot diff against origin/main, not the
      # staged file list; pre-push (not pre-commit) so the base/merge-base
      # resolves and incremental in-progress commits aren't each flagged.
      - id: doc-freshness
        name: doc-freshness (pre-push, advisory)
        entry: python3 .claude/lib/doc_freshness.py .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # office-drift mirrors the `Office docs drift gate` CI job in
      # .github/workflows/docs.yml (the sync-drift gate classifies the
      # `office-drift` kind — #781/#684 — so the CI gate must be mirrored here or
      # the gate goes red). Regenerates the committed Office binaries from their
      # markdown sources and HARD-BLOCKS the push if the bytes differ (a source
      # changed without `make docs`, or a binary was hand-edited). `always_run`
      # because it regenerates the whole manifest, not the staged file list;
      # pre-push (not pre-commit) so it doesn't fire on every incremental commit.
      # Needs a pandoc locally — gen-office.sh resolves the bundled pandoc from
      # the pinned `pypandoc-binary==1.17` (pip install it for zero-setup parity
      # with CI); the same version pin keeps local⇄CI output byte-identical.
      - id: office-drift
        name: office-drift (pre-push)
        entry: bash -c 'scripts/gen-office.sh && git diff --exit-code -- "docs/office/*.docx" "docs/office/*.xlsx" "docs/office/*.pptx"'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # mermaid-render mirrors the `Mermaid render gate` CI job in
      # .github/workflows/docs.yml (the sync-drift gate classifies the `mermaid`
      # kind — #787/#684 — so the CI gate must be mirrored here or the gate goes
      # red). Renders every fenced ```mermaid block in every tracked *.md that
      # contains one (the whole parent tree as of #795, minus .claude/memory/**
      # and .claude/worktrees/**) and HARD-BLOCKS the push on any block that
      # fails to render (#786). Needs
      # mmdc locally — check-mermaid.py resolves $MMDC, then `mmdc` on PATH, then
      # `npx -y @mermaid-js/mermaid-cli` (pin 11.12.0 to match CI). `always_run`
      # because it scans the whole doc set, not the staged file list; pre-push so
      # it doesn't fire (and spin up Chromium) on every incremental commit.
      - id: mermaid-render
        name: mermaid-render (pre-push)
        entry: python3 scripts/check-mermaid.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
