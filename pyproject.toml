[project]
name = "noorinalabs-main"
version = "0.0.0"
description = "Org-level coordination root for noorinalabs (not a published package)"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = []

[tool.mypy]
# Intentionally minimal — the CI/pre-commit invocations still pass their own
# CLI flags (--ignore-missing-imports --no-error-summary). This section exists
# only to host the per-module override below.
#
# #1116: `.claude/hooks/tests/conftest.py` and the pre-existing
# `.claude/lib/tests/conftest.py` are both invoked in a single flat
# `mypy .claude/hooks/ .claude/lib/` run with no `__init__.py` in either
# `tests/` package (needed for pytest's rootless import mode — adding one
# would break every sibling `import hook_module` in both suites). Without
# package markers mypy resolves modules by basename alone and reports the
# two same-named conftest.py files as a "Duplicate module" error. Excluding
# the newer file by its exact path is the narrowest fix: it leaves
# `.claude/lib/tests/conftest.py` type-checked exactly as before, and the
# excluded file is a 6-line autouse-fixture mirror of that one.
exclude = ["^\\.claude/hooks/tests/conftest\\.py$"]

[[tool.mypy.overrides]]
# bashlex (the Bash-AST shell parser the commit-identity hooks use, #748 D3b)
# ships no type stubs. `--ignore-missing-imports` silences import-not-found
# (degraded / uninstalled) but NOT import-untyped (installed-but-untyped — the
# CI typecheck job installs bashlex, so mypy would otherwise emit import-untyped
# there; same situation the ci.yml comment documents for PyYAML). This
# per-module override suppresses both, keeping mypy green in either mode.
module = "bashlex.*"
ignore_missing_imports = true
