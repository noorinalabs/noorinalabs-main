name: Auto-close issues

# Thin caller for the reusable auto-close-on-merge workflow (main#1108). The
# close policy (only-on-merge guard + reference-scanning close logic) lives in
# reusable-auto-close-issues.yml; this file only wires the trigger and grants the
# token scope the reusable needs. Same-repo call uses a local `./` path, which
# always resolves to this commit's copy of the reusable (no cross-repo SHA pin
# needed). Other repos' callers cut over to this reusable as separate stories.

on:
  pull_request:
    types: [closed]

jobs:
  auto-close:
    uses: ./.github/workflows/reusable-auto-close-issues.yml
    permissions:
      issues: write
