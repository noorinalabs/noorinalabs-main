name: CI — Hooks & Scripts

on:
  push:
    branches: [main, "deployments/**"]
    paths:
      - ".claude/hooks/**"
      - ".claude/lib/**"
      - ".claude/skills/**"
      - ".github/workflows/ci.yml"
      - ".pre-commit-config.yaml"
      - "pyproject.toml"
  pull_request:
    branches: [main, "deployments/**"]
    paths:
      - ".claude/hooks/**"
      - ".claude/lib/**"
      - ".claude/skills/**"
      - ".github/workflows/ci.yml"
      - ".pre-commit-config.yaml"
      - "pyproject.toml"

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .claude/hooks/ .claude/lib/

  format:
    name: Ruff format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff format --check .claude/hooks/ .claude/lib/

  typecheck:
    name: Mypy type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mypy
      - run: mypy .claude/hooks/ .claude/lib/ --ignore-missing-imports --no-error-summary

  smoke-test:
    name: Smoke test — hooks compile and exit cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify all hooks and lib files compile
        run: |
          for f in .claude/hooks/*.py .claude/lib/*.py; do
            python3 -c "import py_compile; py_compile.compile('$f', doraise=True)"
          done
      - name: Verify hooks exit 0 on empty stdin
        run: |
          for f in .claude/hooks/*.py; do
            echo '{}' | python3 "$f" || true
          done

  pytest:
    name: Pytest — hooks and lib test suites
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Run hook and lib tests
        run: pytest .claude/hooks/tests/ .claude/lib/tests/ -q

  precommit-ci-sync:
    name: Pre-commit ⇄ CI sync-drift gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify pre-commit config mirrors CI-enforced checks (#327)
        # Fails if a check CI enforces (ruff/mypy/pytest/…) is missing from
        # .pre-commit-config.yaml, so local hooks can't silently drift behind CI.
        run: python3 .claude/lib/pre_commit_ci_sync.py .
