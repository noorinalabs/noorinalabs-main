name: CI — Hooks & Scripts

on:
  push:
    branches: [main, "deployments/**"]
    paths:
      - ".claude/hooks/**"
      - ".claude/lib/**"
      - ".claude/skills/**"
      # The memory-budget gate (#733) caps the project-memory corpus, so a
      # change that only touches memory must still run CI to enforce it.
      - ".claude/memory/**"
      - ".github/workflows/ci.yml"
      - ".pre-commit-config.yaml"
      - "pyproject.toml"
  pull_request:
    branches: [main, "deployments/**"]
    paths:
      - ".claude/hooks/**"
      - ".claude/lib/**"
      - ".claude/skills/**"
      - ".claude/memory/**"
      - ".github/workflows/ci.yml"
      - ".pre-commit-config.yaml"
      - "pyproject.toml"

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pin to the exact ruff the pre-commit hook uses (.pre-commit-config.yaml
      # ruff-pre-commit rev: v0.15.11). Unpinned, CI drifts to a newer ruff whose
      # formatter touches python code blocks embedded in markdown, red-gating
      # `.claude/skills/**/SKILL.md` that pass locally + in pre-commit (#1129).
      - run: pip install ruff==0.15.11
      # .claude/skills/ added per #326: skill helper/test .py (validate_matrix_names.py,
      # promotion-audit/helpers.py, the per-skill tests/, …) was previously
      # un-linted, violating criterion #5 ("anything in the tree gets the same
      # lint/format treatment"). ruff has no module-collision concern, so the
      # flat tree works directly.
      - run: ruff check .claude/hooks/ .claude/lib/ .claude/skills/

  format:
    name: Ruff format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pin to the exact ruff the pre-commit hook uses (.pre-commit-config.yaml
      # ruff-pre-commit rev: v0.15.11). Unpinned, CI drifts to a newer ruff whose
      # formatter touches python code blocks embedded in markdown, red-gating
      # `.claude/skills/**/SKILL.md` that pass locally + in pre-commit (#1129).
      - run: pip install ruff==0.15.11
      - run: ruff format --check .claude/hooks/ .claude/lib/ .claude/skills/

  typecheck:
    name: Mypy type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # types-PyYAML: pre_commit_ci_sync.py imports `yaml` (PyYAML, #748 D3).
      # PyYAML ships no inline types, so without the stubs mypy emits
      # `import-untyped` — which `--ignore-missing-imports` does NOT suppress
      # (it only silences `import-not-found`). Stubs keep this job green.
      # bashlex (#748 D3b): the commit-identity hooks import it for the Bash-AST
      # parse. Installed here so mypy resolves the real module; its missing
      # stubs are handled by the `bashlex.*` override in pyproject.toml.
      - run: pip install mypy types-PyYAML bashlex
      - run: mypy .claude/hooks/ .claude/lib/ --ignore-missing-imports --no-error-summary
      # .claude/skills/ added per #326. mypy is run PER-SKILL-DIRECTORY (not as
      # one flat tree) because two skills each ship a `tests/__init__.py`, which
      # a flat `mypy .claude/skills/` rejects with "Duplicate module named
      # 'tests'". A per-skill loop gives each its own package root. Only skills
      # that contain .py are type-checked.
      - name: Mypy — per-skill (avoids duplicate-tests-module collision)
        run: |
          status=0
          for d in .claude/skills/*/; do
            # Only type-check skills that actually contain .py files.
            # Dependency-free emptiness test (not a text search) — avoids needing
            # grep/rg on the runner just to check whether `find` produced output.
            if [ -n "$(find "$d" -name '*.py' -print -quit)" ]; then
              echo "::group::mypy $d"
              mypy "$d" --ignore-missing-imports --no-error-summary || status=1
              echo "::endgroup::"
            fi
          done
          exit $status

  smoke-test:
    name: Smoke test — hooks compile and exit cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify all hooks, lib, and skill files compile
        # .claude/skills/**/*.py added per #326 (recursively — skill .py lives in
        # nested dirs like wave-kickoff/_orchestration/ and */tests/).
        run: |
          for f in .claude/hooks/*.py .claude/lib/*.py $(find .claude/skills -name '*.py'); do
            python3 -c "import py_compile; py_compile.compile('$f', doraise=True)"
          done
      - name: Verify hooks exit 0 on empty, malformed, and minimal stdin
        # main#1121/#1330 review: this step was doubly vacuous pre-fix — it
        # piped `echo '{}'` (valid JSON, NOT empty stdin, despite the OLD step
        # name "...on empty stdin") AND ended in `|| true` (no exit code could
        # ever fail it). The bug this PR fixes
        # (`validate_wave_label_evidence.py` crashing with exit 1 on genuinely
        # empty/malformed stdin) landed with nothing in CI able to detect a
        # regression. The step name itself was part of the defect — it
        # described an input its body never supplied — so the rename is load-
        # bearing, not cosmetic: it is now kept honest by actually probing all
        # three cases it names, with no swallow, and both the failing file AND
        # the failing probe named in the output.
        run: |
          fail=0
          count=0
          for f in .claude/hooks/*.py; do
            count=$((count + 1))
            for probe in '' 'not-json' '{}'; do
              if ! printf '%s' "$probe" | python3 "$f" >/dev/null 2>&1; then
                echo "FAIL(${probe:-<empty>}): $f"
                fail=1
              fi
            done
          done
          echo "checked $count hook files"
          exit "$fail"

  pytest:
    name: Pytest — hooks and lib test suites
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history (main#1131): test_wave_status.py's
          # BaseVsHeadDifferential execs the pre-fix wave_status.py straight
          # out of a historical commit via `git show <base-sha>:path` to prove
          # the wave-branch path is byte-for-byte unchanged. The default
          # shallow checkout (fetch-depth 1) does not have that object, so the
          # `git show` dies with exit 128 — CI-red even though the test passes
          # locally against a complete clone. Same reason the doc-freshness
          # job below already sets this.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pyyaml: the .claude/lib test suite imports pre_commit_ci_sync, which now
      # imports `yaml` (#748 D3). setup-python's interpreter has no PyYAML
      # preinstalled, so declare it explicitly rather than relying on the
      # ubuntu-runner system Python.
      # bashlex (#748 D3b): required so the commit-identity tests exercise the
      # ENFORCED structural Bash-AST parse path (the bashlex-specific cases
      # skip when it is absent; this install makes CI run them, not skip them).
      - run: pip install pytest pyyaml bashlex
      # zsh (main#1151): `CdRoutingAgainstShellTruth` runs every `cd`-routing
      # shape in a REAL shell and takes the resulting cwd as ground truth. The
      # org's harness shell is zsh, not bash, and at least one construct
      # (`command cd /x`) genuinely differs between them — so a bash-only
      # oracle can adopt a bash-only behaviour as a resolver invariant. The
      # runner image ships bash but not zsh; install it so the zsh half of the
      # oracle RUNS in CI rather than skipping (the tests skip gracefully on a
      # bare checkout without it).
      - name: Install zsh (second shell-truth oracle)
        run: sudo apt-get update && sudo apt-get install -y zsh
      # ripgrep (main#1316/#1318): `RealShellGroundTruthTests` real-shell-
      # verifies the `rg`-exclusion's adversarial rows (`--pre=.../dev/stdin`,
      # `--hostname-bin`) against an actual `rg` binary. This runner image does
      # not ship ripgrep, so those rows were previously either genuinely
      # failing (an expect_runs=True row: `rg: command not found`, so the
      # marker never ran) or passing VACUOUSLY (an expect_runs=False row is
      # trivially true when the shell never even attempts `rg` — measuring
      # nothing while looking identical to a real inertness result). Install
      # it so the measurement actually RUNS in CI, same pattern as the
      # bashlex/zsh installs above — a `skipUnless(which("rg"))` guard alone
      # would only convert the loud failure back into a silent skip, which is
      # the state that let `rg` reach the allowlist in the first place.
      - name: Install ripgrep (real-shell ground truth for the rg exclusion)
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Run hook and lib tests
        run: pytest .claude/hooks/tests/ .claude/lib/tests/ -q
      # .claude/skills/*/tests/ added per #326. Run PER-SKILL (each from its own
      # skill dir as rootdir) because multiple skills ship a top-level `tests`
      # package, which a single flat `pytest .claude/skills/` rejects with a
      # collection error ("import file mismatch" / duplicate `tests` basename).
      - name: Run skill test suites (per-skill rootdir)
        run: |
          status=0
          for t in .claude/skills/*/tests; do
            [ -d "$t" ] || continue
            skill_dir=$(dirname "$t")
            echo "::group::pytest $skill_dir"
            ( cd "$skill_dir" && pytest tests/ -q ) || status=1
            echo "::endgroup::"
          done
          exit $status

  dockerfile-base-pin:
    name: Dockerfile base-image pinning lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Charter-prose→code gate (#735, tech-decisions.md § Base Image Pinning).
      # Discovers every Dockerfile and asserts each FROM is digest-pinned with a
      # well-formed digest value, resolves to a declared registry host (#1204),
      # and carries the matching distro upgrade. A repo needing a registry
      # outside the built-in floor appends `--allow-registry HOST` here and in
      # the matching pre-commit hook entry.
      # Mirrors the `dockerfile-base-pin` pre-commit hook
      # (sync-drift gate classifies the kind). The parent ships no Dockerfiles, so
      # this is a no-op template here; child repos inherit it to scan their real
      # Dockerfiles (#735 follow-up rollout).
      - name: Lint Dockerfile FROM digest-pin + distro upgrade
        run: |
          files=$(find . -path ./.claude/worktrees -prune -o \
            \( -name 'Dockerfile' -o -name 'Dockerfile.*' -o -name '*.dockerfile' \) -print)
          if [ -z "$files" ]; then
            echo "No Dockerfiles in this repo — base-pin lint is a no-op template here (#735)."
            exit 0
          fi
          # shellcheck disable=SC2086  # word-splitting is intended (one path per arg)
          python3 .claude/lib/check_dockerfile_base_pin.py $files

  fixture-realism:
    name: Arabic fixture production-realism lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Charter-prose→code gate (#735, pull-requests.md § Production-Realistic
      # Input). Discovers fixture files and flags Arabic-text fixtures that are
      # un-voweled or lack the عن particle. Mirrors the `fixture-realism`
      # pre-commit hook. The parent ships no Arabic fixtures, so this is a no-op
      # template here; child repos inherit it for their real fixtures (#735
      # follow-up rollout).
      - name: Lint Arabic-text fixtures for vocalization + عن particle
        run: |
          files=$(find . -path ./.claude/worktrees -prune -o \
            \( -path '*/fixtures/*' -o -path '*/test_data/*' -o -path '*/testdata/*' \) \
            -type f \( -name '*.json' -o -name '*.jsonl' -o -name '*.ndjson' \
            -o -name '*.txt' -o -name '*.csv' -o -name '*.tsv' -o -name '*.py' \) -print)
          if [ -z "$files" ]; then
            echo "No fixture files in this repo — realism lint is a no-op template here (#735)."
            exit 0
          fi
          # shellcheck disable=SC2086  # word-splitting is intended (one path per arg)
          python3 .claude/lib/check_fixture_realism.py $files

  skill-graphql-pagination:
    name: GraphQL pagination over-cap lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Skill-markdown GraphQL over-cap guard (#888/#892, wired by #893). Flags any
      # `first: > 100` inside a `gh api graphql` block in a skill markdown file —
      # GitHub caps connection `first:` at 100, and the silent zero-row read made
      # `/board-audit` treat every issue as an orphan. Mirrors the
      # `skill-graphql-pagination` pre-commit hook (the sync-drift gate classifies
      # the kind, so this mirror is mandatory). The lint self-scopes to
      # gh-api-graphql blocks, so a `first:` in prose is ignored.
      - name: "Lint skill markdown for GraphQL first: > 100 over-cap"
        run: |
          files=$(find .claude/skills -name '*.md' -print)
          if [ -z "$files" ]; then
            echo "No skill markdown files found — pagination lint is a no-op here."
            exit 0
          fi
          # shellcheck disable=SC2086  # word-splitting is intended (one path per arg)
          python3 .claude/lib/lint_skill_graphql_pagination.py $files

  skill-bash-dialect:
    name: Skill bash-dialect lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Skill/hooks-markdown bash-dialect guard (noorinalabs-main#1485). Flags
      # `[ "$A" \< "$B" ]` / `[ "$A" \> "$B" ]` — a bash-only string-comparison
      # operator inside a POSIX `[ ]` test — in any shell-tagged fenced code
      # block. Under zsh (this org's shell for both the interactive prompt and
      # the agent Bash tool) the operator errors instead of evaluating, so an
      # `if` guarding on it silently takes the "false" branch: `/wave-kickoff`
      # Step 0a's staleness guard had been fail-open in exactly this shape.
      # Mirrors the `skill-bash-dialect` pre-commit hook (the sync-drift gate
      # classifies the kind, so this mirror is mandatory). The lint self-scopes
      # to shell-tagged/untagged fenced code blocks and skips comment lines, so
      # prose or a comment explaining the bug does not self-trigger.
      - name: "Lint skill/hooks markdown for bash-only [ \\< ] / [ \\> ] operators"
        run: |
          files=$(find .claude/skills .claude/hooks -name '*.md' -print)
          if [ -z "$files" ]; then
            echo "No skill/hooks markdown files found — bash-dialect lint is a no-op here."
            exit 0
          fi
          # shellcheck disable=SC2086  # word-splitting is intended (one path per arg)
          python3 .claude/lib/lint_skill_bash_dialect.py $files

  precommit-ci-sync:
    name: Pre-commit ⇄ CI sync-drift gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pyyaml: the gate now parses both sides structurally with `yaml.safe_load`
      # (#748 D3). Declared explicitly — setup-python's interpreter has no PyYAML
      # preinstalled, and the gate must not depend on the runner's system Python.
      - run: pip install pyyaml
      - name: Verify pre-commit config mirrors CI-enforced checks (#327)
        # Fails if a check CI enforces (ruff/mypy/pytest/…) is missing from
        # .pre-commit-config.yaml, so local hooks can't silently drift behind CI.
        run: python3 .claude/lib/pre_commit_ci_sync.py .

  memory-budget:
    name: Memory budget gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce the project-memory corpus size/count budget (#733)
        # HARD-BLOCKS if MEMORY.md index entries / memory-file count / MEMORY.md
        # byte size exceed the budget in memory_budget.py. Mirrored locally by the
        # `memory-budget` pre-push hook; the sync-drift gate classifies the kind.
        run: python3 .claude/lib/memory_budget.py .

  headcount-budget:
    name: Headcount budget gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce the persona-roster headcount budget (#841)
        # HARD-BLOCKS if the parent persona roster (.claude/team/roster/*.md)
        # exceeds the cap in headcount_budget.py (parent <=9). Mirrored locally by
        # the `headcount-budget` pre-push hook; the sync-drift gate classifies the
        # kind. Runs with the default (parent) budget — a child repo vendoring
        # this gate invokes with `--budget 6`.
        run: python3 .claude/lib/headcount_budget.py .

  doc-freshness:
    name: Doc-freshness gate (advisory)
    runs-on: ubuntu-latest
    # ADVISORY (#768): doc_freshness.py always exits 0, so this job is green by
    # construction; continue-on-error makes the advisory intent explicit so a
    # future edit can't silently turn a heuristic freshness nudge into a hard
    # gate. The report still surfaces in the job log. Mirrored locally by the
    # `doc-freshness` pre-push hook; the sync-drift gate classifies the kind
    # (#684 parity) — the advisory check is mirrored, not exempt.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the merge-base three-dot diff against the PR base
          # resolves (the default shallow checkout has no merge-base).
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Report code surfaces changed without a matching doc update (#768)
        # Base ref comes from origin/$GITHUB_BASE_REF on a pull_request, falling
        # back to origin/main. The PR body is passed so a `Docs-N/A` opt-out in
        # the body (not just a commit message) is honored.
        env:
          DOC_FRESHNESS_OPT_OUT_TEXT: ${{ github.event.pull_request.body }}
        run: python3 .claude/lib/doc_freshness.py .
