name: CI — Docs & Config

# Phase-3 end-state criterion #5 (noorinalabs-main#326): all committed
# artifacts pass checks — including documentation and config. The python
# hooks/lib code is gated by ci.yml; this workflow closes the NON-python gap:
# markdown/docs (lint + spellcheck + internal link-check) and committed config
# (YAML/JSON syntax + workflow actionlint) across the parent tree (.claude/team,
# .claude/skills, ontology, docs, root). Artifact-class ownership is per
# charter/artifact-ownership.md (#328): these are all parent-canonical, so they
# are gated here at the parent.

on:
  push:
    branches: [main, "deployments/**"]
    paths:
      - "**/*.md"
      - "**/*.yaml"
      - "**/*.yml"
      # `**/*.json` keeps the config-lint trigger aligned with the job's own
      # scope (it parses every committed .json recursively). The prior list
      # only caught .json under ontology/ + .claude/team/ + .cspell.json, so
      # root cross-repo-status.json — the org's highest-churn JSON, edited
      # every wave-scope/kickoff/wrapup — plus .claude/{settings,hooks
      # fixtures,skills fixtures}/*.json merged with NO syntax gate (#613).
      - "**/*.json"
      - "ontology/**"
      - ".claude/team/**"
      - ".markdownlint-cli2.jsonc"
      - ".cspell.json"
      - ".cspell/**"
      - ".lychee.toml"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main, "deployments/**"]
    paths:
      - "**/*.md"
      - "**/*.yaml"
      - "**/*.yml"
      # See push.paths note above (#613): `**/*.json` aligns the trigger with
      # the config-lint job's recursive .json scope.
      - "**/*.json"
      - "ontology/**"
      - ".claude/team/**"
      - ".markdownlint-cli2.jsonc"
      - ".cspell.json"
      - ".cspell/**"
      - ".lychee.toml"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: markdownlint-cli2
        # Config (.markdownlint-cli2.jsonc) carries the glob + ignores and
        # disables the stylistic rules the dense charter corpus intentionally
        # violates, keeping the structural rules that catch real breakage.
        uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v23.2.0

  spellcheck:
    name: Spellcheck (cspell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cspell
        uses: streetsidesoftware/cspell-action@de2a73e963e7443969755b648a1008f77033c5b2 # v8.4.0
        with:
          # Dictionary + ignore rules come from .cspell.json. The `files` glob
          # here is authoritative for the action (it overrides config-side
          # discovery), so it is scoped to the AUTHORED-prose set — charter,
          # skills, ontology, root docs. The append-only records (feedback_log,
          # trust_matrix, promotion_audit_log) and roster cards are excluded:
          # they are dense with person/narrator names and SHAs that are not
          # spell-defects, and gating them would mean maintaining a names
          # dictionary in the thousands. A real typo in authored prose blocks;
          # new domain terms go in .cspell/project-words.txt.
          config: ".cspell.json"
          files: |
            .claude/team/charter/**/*.md
            .claude/skills/**/*.md
            ontology/**/*.md
            CLAUDE.md
            ONBOARDING.md
            README.md
            docs/**/*.md
          incremental_files_only: false
          strict: true

  linkcheck:
    name: Internal link-check (lychee)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lychee
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          # .lychee.toml runs offline (internal/relative links only; external
          # URL liveness is intentionally not gated — third-party uptime must
          # not flake the docs gate). A broken relative cross-reference fails.
          args: "--config .lychee.toml --no-progress './**/*.md'"
          fail: true

  config-lint:
    name: Config — YAML/JSON syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate committed YAML + JSON parse (parent tree only)
        # Generated/vendored trees and the gitignored child repos are excluded.
        # A committed config file that does not parse is a real defect — this is
        # the syntax floor for the non-python config artifacts ci.yml ignores.
        run: |
          python3 - <<'PY'
          import json
          import sys
          import pathlib

          try:
              import yaml  # PyYAML is preinstalled on ubuntu-latest runners
          except ImportError:
              import subprocess

              subprocess.check_call([sys.executable, "-m", "pip", "install", "pyyaml"])
              import yaml

          skip_prefixes = (
              "noorinalabs-isnad-graph/",
              "noorinalabs-user-service/",
              "noorinalabs-deploy/",
              "noorinalabs-design-system/",
              "noorinalabs-data-acquisition/",
              "noorinalabs-isnad-ingest-platform/",
              "noorinalabs-landing-page/",
              ".claude/worktrees/",
              "node_modules/",
              ".git/",
          )
          root = pathlib.Path(".")
          failures = []
          for path in root.rglob("*"):
              rel = path.as_posix()
              if path.is_dir() or rel.startswith(skip_prefixes):
                  continue
              if path.suffix in (".yaml", ".yml"):
                  try:
                      list(yaml.safe_load_all(path.read_text(encoding="utf-8")))
                  except Exception as exc:  # noqa: BLE001
                      failures.append(f"{rel}: YAML parse error: {exc}")
              elif path.suffix == ".json":
                  try:
                      json.loads(path.read_text(encoding="utf-8"))
                  except Exception as exc:  # noqa: BLE001
                      failures.append(f"{rel}: JSON parse error: {exc}")
          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("All committed YAML/JSON parse cleanly.")
          PY

  actionlint:
    name: Config — Workflow actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify actionlint
        env:
          # Pinned: version + linux_amd64 tarball SHA256 from upstream's
          # signed release manifest (actionlint_1.7.12_checksums.txt at
          # https://github.com/rhysd/actionlint/releases/tag/v1.7.12).
          # `sha256sum -c` aborts the job on mismatch — bytes-on-runner are
          # exactly what was published at release time. Replaces the prior
          # `curl|bash` of the unpinned download-actionlint.bash off `main`
          # (#578): fetching+executing latest-of-main each run is a
          # supply-chain gap and diverges from the pinned v1.7.12 the
          # .pre-commit-config.yaml mirror already ships (#571).
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location \
            -o "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
          install -m 0755 actionlint /usr/local/bin/actionlint
          actionlint -version
      - name: Run actionlint on parent workflows
        # shellcheck is preinstalled on ubuntu-latest, so actionlint's embedded
        # shellcheck integration runs (per the actionlint-needs-shellcheck
        # discipline) rather than silently skipping.
        run: actionlint -color

